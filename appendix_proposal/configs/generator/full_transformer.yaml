model: transformer_aif
preset: run
dataset_root: datasets/generator_training
output_dir: outputs/generators
H: 8
history_len: 4
variant: gmm
hidden_dim: 512
num_layers: 4
num_heads: 8
num_components: 8
dropout: 0.05
failure_conditioned: true
failure_sidecar_paths: datasets/specialist_policy_approved_v1/runs/*/settings/*/failure_trajectories.npz
max_failure_windows: 120000
batch_size: 4096
epochs: 30
learning_rate: 0.0002
device: cuda
num_workers: 12
prefetch_factor: 4
